version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # The marketing page is a separate package with its own lockfile, so the root
  # entry does not cover it. The landing CI job builds it on every pull request,
  # so an update that breaks it fails the check rather than shipping.
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check declares its peer range as ^5 || ^6, so TypeScript 7
      # cannot be installed here at all: `npm ci` fails with ERESOLVE and the
      # build never starts. Dependabot proposed it twice. Revisit when that
      # peer range moves.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
