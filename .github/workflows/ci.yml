name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:package
      - run: npm run size
      - run: npm audit --omit=dev

  package-tests:
    name: companion package build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:packages

  test:
    name: test (node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:root -- --shard=${{ matrix.shard }}/4

  test-22:
    if: always()
    name: test (node 22)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.test.result }}"
          if [ "$results" = "success" ] || [ "$results" = "skipped" ]; then
            echo "All node 22 shards passed"
          else
            echo "Some node 22 shards failed"
            exit 1
          fi

  test-24:
    if: always()
    name: test (node 24)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.test.result }}"
          if [ "$results" = "success" ] || [ "$results" = "skipped" ]; then
            echo "All node 24 shards passed"
          else
            echo "Some node 24 shards failed"
            exit 1
          fi
