name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:examples
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npm run check:package
      - run: npm run size
      - run: bash tools/check-doc-examples.sh
      - run: npm run check:subpaths
      - run: npm audit --omit=dev

  package-tests:
    name: companion package build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:packages

  test:
    name: test (node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:root -- --shard=${{ matrix.shard }}/4

  test-22:
    if: always()
    name: test (node 22)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.test.result }}"
          if [ "$results" = "success" ] || [ "$results" = "skipped" ]; then
            echo "All node 22 shards passed"
          else
            echo "Some node 22 shards failed"
            exit 1
          fi

  test-24:
    if: always()
    name: test (node 24)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.test.result }}"
          if [ "$results" = "success" ] || [ "$results" = "skipped" ]; then
            echo "All node 24 shards passed"
          else
            echo "Some node 24 shards failed"
            exit 1
          fi

  coverage:
    # Not sharded: the thresholds are global, so the suite has to run in one go.
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  landing:
    # The marketing page is a separate Astro package. It is not published, but it
    # deploys on every push to main, so it gets the same treatment as the library:
    # if it cannot build, or if the numbers it prints have drifted from the
    # repository, CI says so instead of the site quietly going wrong.
    name: landing page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npm run check:facts
        working-directory: landing
      - run: npm run check
        working-directory: landing
      - run: npm run build
        working-directory: landing

